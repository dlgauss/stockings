{% load i18n %}
<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="combo" data-combo="{{ kind }}">
    {% if kind == "city" %}
    <svg class="combo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    {% else %}
    <svg class="combo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
    {% endif %}
    {{ field }}
    <button type="button" class="combo-clear" aria-label="{% translate "Clear" %}" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <span class="combo-end" aria-hidden="true">
      <svg class="combo-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      <span class="combo-spinner"></span>
    </span>
    <div class="combo-panel" hidden>
      <p class="combo-status" aria-live="polite"></p>
      <ul class="combo-list" role="listbox" id="suggest-{{ kind }}"></ul>
    </div>
  </div>
  <p class="hint combo-hint" hidden></p>
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
